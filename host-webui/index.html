<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGNAL</title>
  <style>
    :root {
      --void: #04060a;
      --cyan: #4dffd2;
      --cyan-dim: rgba(77, 255, 210, 0.14);
      --amber: #ff9a3c;
      --ink: #d7fff4;
      --mute: #6f8f86;
      --line: rgba(77, 255, 210, 0.22);
      --danger: #ff5a4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Avenir Next Condensed", "Avenir Next", "Segoe UI", sans-serif;
      background: var(--void);
      color: var(--ink);
      overflow: hidden;
    }
    .stage {
      display: grid;
      grid-template-columns: 1fr minmax(260px, 400px);
      gap: 1rem;
      min-height: 0;
      align-items: stretch;
    }
    .playlist {
      overflow-y: auto;
      text-align: left;
      border: 1px solid var(--line);
      background: rgba(4, 10, 12, 0.62);
      backdrop-filter: blur(6px);
      min-height: 0;
    }
    .playlist h2 {
      margin: 0;
      padding: 0.55rem 0.7rem;
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--mute);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(4, 10, 12, 0.92);
    }
    .playlist button.row {
      display: block;
      width: 100%;
      text-align: left;
      letter-spacing: 0.02em;
      text-transform: none;
      min-width: 0;
      border: 0;
      border-bottom: 1px solid rgba(77, 255, 210, 0.08);
      border-radius: 0;
      box-shadow: none;
      padding: 0.55rem 0.7rem;
      background: transparent;
      color: var(--ink);
      font-size: 0.82rem;
    }
    .playlist button.row:hover { background: var(--cyan-dim); }
    .playlist button.row.active {
      color: var(--amber);
      background: rgba(255, 154, 60, 0.12);
    }
    .playlist .num {
      color: var(--mute);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      margin-right: 0.45rem;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(4, 10, 12, 0.92);
      z-index: 1;
    }
    .tabs button {
      flex: 1;
      min-width: 0;
      letter-spacing: 0.16em;
      font-size: 0.62rem;
      padding: 0.55rem 0.3rem;
      border: 0;
      box-shadow: none;
      border-bottom: 1px solid transparent;
    }
    .tabs button.on {
      color: var(--amber);
      border-bottom-color: var(--amber);
    }
    .drop {
      margin: 0.8rem 0.7rem;
      padding: 1.1rem 0.8rem;
      border: 1px dashed var(--line);
      text-align: center;
      color: var(--mute);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }
    .drop.hot { border-color: var(--amber); color: var(--amber); }
    .drop input { display: none; }
    .upload-log {
      margin: 0 0.7rem 0.8rem;
      font-size: 0.75rem;
      color: var(--mute);
      min-height: 1.2em;
    }
    .bar {
      margin: 0.6rem 0.7rem 0;
      height: 3px;
      background: rgba(77,255,210,0.12);
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--cyan);
    }
    .filter {
      display: block;
      width: calc(100% - 1.4rem);
      margin: 0.55rem 0.7rem 0.2rem;
      background: #07100e;
      color: var(--ink);
      border: 1px solid var(--line);
      font: inherit;
      font-size: 0.75rem;
      padding: 0.35rem 0.4rem;
    }
    .mgr {
      display: grid;
      grid-template-columns: 1fr 7.2rem 2.1rem;
      gap: 0.3rem;
      align-items: center;
      padding: 0.4rem 0.55rem;
      border-bottom: 1px solid rgba(77, 255, 210, 0.08);
    }
    .mgr .ttl {
      font-size: 0.75rem;
      letter-spacing: 0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mgr select {
      width: 100%;
      background: #07100e;
      color: var(--ink);
      border: 1px solid var(--line);
      font: inherit;
      font-size: 0.68rem;
      padding: 0.25rem 0.2rem;
    }
    .mgr .x {
      min-width: 0;
      padding: 0.3rem 0;
      letter-spacing: 0;
      font-size: 0.85rem;
      color: var(--danger);
      border-color: rgba(255, 90, 74, 0.45);
      box-shadow: none;
    }
    canvas#viz {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.09;
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 2px,
        rgba(0, 0, 0, 0.35) 3px
      );
    }
    .hud {
      position: relative;
      z-index: 2;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 1.1rem 1.25rem 1.2rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .top, .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
    }
    .mark {
      letter-spacing: 0.42em;
      font-size: 0.68rem;
      color: var(--cyan);
      text-transform: uppercase;
    }
    h1 {
      margin: 0.2rem 0 0;
      font-weight: 500;
      letter-spacing: 0.18em;
      font-size: clamp(1.1rem, 3vw, 1.7rem);
      text-transform: uppercase;
    }
    .chip {
      border: 1px solid var(--line);
      padding: 0.35rem 0.55rem;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      background: rgba(4, 8, 10, 0.45);
    }
    .chip.live, .chip.pause { color: var(--amber); border-color: rgba(255, 154, 60, 0.55); }
    .chip.pause { color: #ffd27a; }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 1.4rem;
      text-align: center;
    }
    .now-label {
      letter-spacing: 0.34em;
      font-size: 0.65rem;
      color: var(--mute);
      text-transform: uppercase;
    }
    .now {
      margin: 0.35rem 0 0.2rem;
      font-size: clamp(1.2rem, 3.4vw, 2rem);
      font-weight: 500;
      letter-spacing: 0.04em;
      max-width: 90vw;
      text-shadow: 0 0 24px rgba(77, 255, 210, 0.25);
    }
    .meta { color: var(--mute); font-size: 0.85rem; min-height: 1.2em; }
    .err { color: var(--danger); }
    .seek {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: min(540px, 94%);
      margin: 0.85rem auto 0;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      color: var(--mute);
    }
    .scrub {
      position: relative;
      flex: 1;
      height: 18px;
      display: flex;
      align-items: center;
    }
    .scrub-track {
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      border-radius: 99px;
      background: rgba(77, 255, 210, 0.14);
      pointer-events: none;
    }
    .scrub-fill {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan), var(--amber));
      box-shadow: 0 0 10px rgba(255, 154, 60, 0.35);
    }
    .seek input[type=range] {
      position: relative;
      width: 100%;
      height: 18px;
      margin: 0;
      background: transparent;
      accent-color: var(--amber);
      z-index: 1;
      -webkit-appearance: none;
      appearance: none;
    }
    .seek input[type=range]::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
    }
    .seek input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--amber);
      border: 0;
      margin-top: -4px;
      box-shadow: 0 0 8px rgba(255, 154, 60, 0.7);
    }
    .seek input[type=range]::-moz-range-track {
      height: 4px;
      background: transparent;
      border: 0;
    }
    .seek input[type=range]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--amber);
      border: 0;
      box-shadow: 0 0 8px rgba(255, 154, 60, 0.7);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: center;
      align-items: center;
      margin-top: 1.15rem;
    }
    button {
      appearance: none;
      cursor: pointer;
      border: 1px solid var(--cyan);
      background: transparent;
      color: var(--ink);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.72rem;
      padding: 0.7rem 1.15rem;
      min-width: 6.4rem;
      box-shadow: 0 0 16px rgba(77, 255, 210, 0.08);
    }
    button:hover { background: var(--cyan-dim); }
    button:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
    button.primary {
      background: var(--cyan);
      color: #03110c;
      font-weight: 600;
    }
    .vol {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.68rem;
      color: var(--mute);
      margin-left: 0.4rem;
    }
    input[type=range] {
      width: 150px;
      accent-color: var(--amber);
    }
    .stats {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      color: var(--mute);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }
    .stats b { color: var(--ink); font-weight: 500; }
    @media (max-width: 860px) {
      .stats { display: none; }
      body { overflow: auto; }
      .hud { height: auto; min-height: 100%; }
      .stage { grid-template-columns: 1fr; }
      .playlist { max-height: 42vh; }
    }
  </style>
</head>
<body>
  <canvas id="viz"></canvas>
  <div class="grain"></div>
  <div class="hud">
    <div class="top">
      <div>
        <div class="mark">Local node</div>
        <h1 id="title">SIGNAL</h1>
      </div>
      <div class="chip" id="chip">STANDBY</div>
    </div>
    <div class="stage">
      <div class="center">
        <div class="now-label">Now playing</div>
        <div class="now" id="track">—</div>
        <div class="meta" id="player-sub">linking host</div>
        <div class="seek" id="seek-wrap">
          <span id="t-now">0:00</span>
          <div class="scrub">
            <div class="scrub-track"><div class="scrub-fill" id="scrub-fill"></div></div>
            <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek">
          </div>
          <span id="t-end">0:00</span>
        </div>
        <div class="controls">
          <button class="primary" id="btn-play" type="button">Play</button>
          <button id="btn-pause" type="button">Pause</button>
          <button id="btn-stop" type="button">Stop</button>
          <button id="btn-next" type="button">Next</button>
          <label class="vol">Vol
            <input id="vol" type="range" min="0" max="100" value="80">
            <span id="vol-label">80</span>
          </label>
        </div>
      </div>
      <aside class="playlist">
        <div class="tabs">
          <button type="button" class="on" id="tab-lib">Library</button>
          <button type="button" id="tab-mgr">Manage</button>
          <button type="button" id="tab-up">Upload</button>
        </div>
        <div id="pane-lib"></div>
        <div id="pane-mgr" hidden></div>
        <div id="pane-up" hidden>
          <label class="drop" id="drop">Drop opus / mp3 / flac here
            <input id="file" type="file" accept=".opus,.mp3,.flac,.ogg,.wav,.m4a,.aac,audio/*" multiple>
          </label>
          <div class="bar"><span id="prog"></span></div>
          <div class="upload-log" id="uplog">Files land in /data/music</div>
        </div>
      </aside>
    </div>
    <div class="bottom">
      <div class="stats">
        <span>HOST <b id="hostname">—</b></span>
        <span>NET <b id="ip">—</b></span>
        <span>UP <b id="uptime">—</b></span>
        <span>MEM <b id="mem">—</b></span>
      </div>
      <div class="stats"><span id="stamp"></span></div>
    </div>
  </div>
  <script>
    const state = {
      playing: false, paused: false, rms: 0, volume: 80,
      position: 0, duration: 0, posAt: 0, scrubbing: false,
      bins: new Float32Array(72), filter: "", lastPlayer: null
    };
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0, dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.clientWidth;
      h = canvas.clientHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function fmtBytes(n) {
      if (n == null) return "—";
      const u = ["B", "KB", "MB", "GB"];
      let i = 0, x = n;
      while (x >= 1024 && i < u.length - 1) { x /= 1024; i++; }
      return x.toFixed(i === 0 ? 0 : 1) + " " + u[i];
    }

    function noise(i, t) {
      return 0.5 + 0.5 * Math.sin(i * 0.37 + t * 2.1) * Math.cos(i * 0.11 - t * 1.4);
    }

    function tick(ts) {
      const t = ts / 1000;
      const cx = w / 2;
      const cy = h * 0.42;
      const energy = state.playing ? (0.22 + state.rms * 0.9) * (0.35 + state.volume / 140) : 0.06;
      const n = state.bins.length;
      for (let i = 0; i < n; i++) {
        const target = energy * (0.35 + noise(i, t) * (state.playing ? 1 : 0.25));
        state.bins[i] += (target - state.bins[i]) * 0.22;
      }
      ctx.fillStyle = "rgba(4, 6, 10, 0.28)";
      ctx.fillRect(0, 0, w, h);

      const grd = ctx.createRadialGradient(cx, cy, 20, cx, cy, Math.max(w, h) * 0.55);
      grd.addColorStop(0, state.playing ? "rgba(77,255,210,0.10)" : "rgba(77,255,210,0.03)");
      grd.addColorStop(1, "rgba(4,6,10,0)");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "rgba(77,255,210,0.06)";
      ctx.lineWidth = 1;
      for (let r = 80; r < 420; r += 46) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      const sweep = t * 0.7;
      ctx.beginPath();
      ctx.strokeStyle = "rgba(255,154,60,0.18)";
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(sweep) * 380, cy + Math.sin(sweep) * 380);
      ctx.stroke();

      const radius = Math.min(w, h) * 0.28;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 - Math.PI / 2;
        const mag = state.bins[i];
        const inner = radius * 0.62;
        const outer = inner + mag * radius * 1.15;
        const x0 = cx + Math.cos(a) * inner;
        const y0 = cy + Math.sin(a) * inner;
        const x1 = cx + Math.cos(a) * outer;
        const y1 = cy + Math.sin(a) * outer;
        ctx.strokeStyle = i % 8 === 0 ? "rgba(255,154,60,0.9)" : "rgba(77,255,210,0.85)";
        ctx.lineWidth = i % 8 === 0 ? 2.2 : 1.3;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.18 + energy * 18, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(77,255,210,0.85)";
      ctx.lineWidth = 2;
      ctx.stroke();

      const frac = state.duration > 0 ? Math.max(0, Math.min(1, livePos() / state.duration)) : 0;
      if (frac > 0) {
        const ring = radius * 0.18 + energy * 18 + 11;
        ctx.beginPath();
        ctx.strokeStyle = "rgba(77,255,210,0.16)";
        ctx.lineWidth = 3;
        ctx.arc(cx, cy, ring, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255,154,60,0.95)";
        ctx.lineWidth = 3;
        ctx.arc(cx, cy, ring, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, 3 + energy * 10, 0, Math.PI * 2);
      ctx.fillStyle = state.playing ? "rgba(255,154,60,0.95)" : "rgba(77,255,210,0.5)";
      ctx.fill();
      paintSeek();

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    async function refresh() {
      try {
        const r = await fetch("/api/status", { cache: "no-store" });
        if (!r.ok) throw new Error("http " + r.status);
        const d = await r.json();
        document.getElementById("title").textContent = d.hostname || "SIGNAL";
        document.getElementById("hostname").textContent = d.hostname || "—";
        document.getElementById("ip").textContent = d.ip || "—";
        document.getElementById("uptime").textContent = d.uptime || "—";
        document.getElementById("mem").textContent = d.mem
          ? fmtBytes(d.mem.used) + " / " + fmtBytes(d.mem.total)
          : "—";
        const p = d.player || {};
        applyPlayer(p);
        const chip = document.getElementById("chip");
        chip.textContent = state.playing ? "LIVE" : (state.paused ? "PAUSED" : "STANDBY");
        chip.className = "chip" + (state.playing ? " live" : (state.paused ? " pause" : ""));
        document.getElementById("track").textContent = prettyName(p.track) || "No media";
        const sub = document.getElementById("player-sub");
        sub.className = "meta" + (p.error ? " err" : "");
        sub.textContent = p.error
          ? p.error
          : ((p.tracks && p.tracks.length)
            ? (state.playing ? "decode · paplay · spdif" : (state.paused ? "paused" : "library " + p.tracks.length))
            : "empty /data/music");
        const pauseBtn = document.getElementById("btn-pause");
        pauseBtn.textContent = state.paused ? "Resume" : "Pause";
        pauseBtn.disabled = !state.playing && !state.paused;
        if (typeof p.volume === "number" && document.activeElement !== document.getElementById("vol")) {
          document.getElementById("vol").value = p.volume;
          document.getElementById("vol-label").textContent = p.volume;
        }
        state.lastPlayer = p;
        renderList(p);
        renderManage(p);
        document.getElementById("stamp").textContent = new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("player-sub").textContent = String(err.message || err);
        document.getElementById("player-sub").className = "meta err";
      }
    }
    function prettyName(path) {
      const base = (path || "").split("/").pop() || path || "";
      return base.replace(/\.[^.]+$/, "");
    }
    function fmtTime(sec) {
      if (sec == null || !isFinite(sec) || sec < 0) return "0:00";
      sec = Math.floor(sec);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h) return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      return m + ":" + String(s).padStart(2, "0");
    }
    function livePos() {
      let pos = state.position || 0;
      if (state.playing && !state.scrubbing) {
        pos += (performance.now() - (state.posAt || performance.now())) / 1000;
      }
      if (state.duration > 0) pos = Math.min(pos, state.duration);
      return Math.max(0, pos);
    }
    function applyPlayer(p) {
      state.playing = !!p.playing;
      state.paused = !!p.paused;
      state.rms = typeof p.rms === "number" ? p.rms : 0;
      state.volume = typeof p.volume === "number" ? p.volume : state.volume;
      if (typeof p.position === "number") state.position = p.position;
      if (typeof p.duration === "number") state.duration = p.duration;
      state.posAt = performance.now();
      paintSeek();
    }
    function paintSeek() {
      if (state.scrubbing) return;
      const pos = livePos();
      const dur = state.duration || 0;
      const frac = dur > 0 ? pos / dur : 0;
      document.getElementById("t-now").textContent = fmtTime(pos);
      document.getElementById("t-end").textContent = fmtTime(dur);
      document.getElementById("scrub").value = Math.round(frac * 1000);
      document.getElementById("scrub-fill").style.width = (frac * 100) + "%";
    }
    function renderList(p) {
      const box = document.getElementById("pane-lib");
      const tracks = p.tracks || [];
      const tags = p.tags || {};
      const idx = typeof p.index === "number" ? p.index : -1;
      const sig = tracks.length + ":" + idx + ":" + state.filter + ":" + JSON.stringify(tags);
      if (box.dataset.sig === sig) return;
      box.dataset.sig = sig;
      box.innerHTML = "";
      const filter = document.createElement("select");
      filter.className = "filter";
      filter.innerHTML = "<option value=\"\">All genres</option>" +
        (p.genres || []).map((g) => "<option value=\"" + g + "\"" + (state.filter === g ? " selected" : "") + ">" + g + "</option>").join("");
      filter.onchange = () => { state.filter = filter.value; box.dataset.sig = ""; renderList(state.lastPlayer || p); };
      box.appendChild(filter);
      tracks.forEach((name, i) => {
        const genre = tags[name] || "";
        if (state.filter && genre !== state.filter) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "row" + (i === idx ? " active" : "");
        btn.innerHTML = "<span class=\"num\">" + String(i + 1).padStart(2, "0") + "</span>" + prettyName(name) +
          (genre ? " <span class=\"num\">" + genre + "</span>" : "");
        btn.onclick = () => post("/api/play", { index: i });
        box.appendChild(btn);
      });
      const active = box.querySelector(".row.active");
      if (active) active.scrollIntoView({ block: "nearest" });
    }
    function renderManage(p) {
      const box = document.getElementById("pane-mgr");
      if (document.activeElement && box.contains(document.activeElement)) return;
      const tracks = p.tracks || [];
      const tags = p.tags || {};
      const genres = p.genres || [];
      const sig = tracks.join("|") + JSON.stringify(tags);
      if (box.dataset.sig === sig) return;
      box.dataset.sig = sig;
      box.innerHTML = "";
      tracks.forEach((name, i) => {
        const row = document.createElement("div");
        row.className = "mgr";
        const ttl = document.createElement("div");
        ttl.className = "ttl";
        ttl.textContent = prettyName(name);
        const sel = document.createElement("select");
        sel.innerHTML = "<option value=\"\">Genre</option>" +
          genres.map((g) => "<option value=\"" + g + "\"" + ((tags[name] || "") === g ? " selected" : "") + ">" + g + "</option>").join("");
        sel.onchange = () => post("/api/tag", { index: i, genre: sel.value });
        const del = document.createElement("button");
        del.type = "button";
        del.className = "x";
        del.textContent = "×";
        del.title = "Delete from host";
        del.onclick = () => {
          if (confirm("Delete this track from the host?")) post("/api/delete", { index: i });
        };
        row.appendChild(ttl);
        row.appendChild(sel);
        row.appendChild(del);
        box.appendChild(row);
      });
    }
    function showTab(which) {
      document.getElementById("tab-lib").classList.toggle("on", which === "lib");
      document.getElementById("tab-mgr").classList.toggle("on", which === "mgr");
      document.getElementById("tab-up").classList.toggle("on", which === "up");
      document.getElementById("pane-lib").hidden = which !== "lib";
      document.getElementById("pane-mgr").hidden = which !== "mgr";
      document.getElementById("pane-up").hidden = which !== "up";
    }
    function uploadFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      const fd = new FormData();
      files.forEach((f) => fd.append("file", f, f.name));
      const xhr = new XMLHttpRequest();
      const log = document.getElementById("uplog");
      const bar = document.getElementById("prog");
      log.textContent = "Sending " + files.length + " file" + (files.length > 1 ? "s" : "") + "…";
      bar.style.width = "0%";
      xhr.upload.onprogress = (ev) => {
        if (!ev.lengthComputable) return;
        bar.style.width = Math.round((ev.loaded / ev.total) * 100) + "%";
      };
      xhr.onload = () => {
        let msg = xhr.responseText;
        try {
          const d = JSON.parse(xhr.responseText);
          const n = (d.saved || []).length;
          const err = (d.errors || []).join("; ");
          msg = n ? ("Saved " + n) : "Nothing saved";
          if (err) msg += " · " + err;
          if (d.error) msg = d.error;
        } catch (_e) {}
        log.textContent = msg;
        bar.style.width = "100%";
        document.getElementById("pane-lib").dataset.sig = "";
        document.getElementById("pane-mgr").dataset.sig = "";
        refresh();
      };
      xhr.onerror = () => { log.textContent = "upload failed"; };
      xhr.open("POST", "/api/upload");
      xhr.send(fd);
    }
    async function post(path, body) {
      await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      refresh();
    }
    document.getElementById("btn-play").onclick = () => post("/api/play");
    document.getElementById("btn-pause").onclick = () => {
      if (state.paused) post("/api/play");
      else post("/api/pause");
    };
    document.getElementById("btn-stop").onclick = () => post("/api/stop");
    document.getElementById("btn-next").onclick = () => post("/api/next");
    const scrub = document.getElementById("scrub");
    scrub.oninput = () => {
      state.scrubbing = true;
      const dur = state.duration || 0;
      const pos = dur * (Number(scrub.value) / 1000);
      document.getElementById("t-now").textContent = fmtTime(pos);
      document.getElementById("scrub-fill").style.width = (Number(scrub.value) / 10) + "%";
    };
    function commitSeek() {
      const dur = state.duration || 0;
      const pos = dur * (Number(scrub.value) / 1000);
      state.position = pos;
      state.posAt = performance.now();
      state.scrubbing = false;
      if (dur > 0) post("/api/seek", { seconds: pos });
    }
    scrub.onchange = commitSeek;
    scrub.onkeyup = (ev) => { if (ev.key === "Enter") commitSeek(); };
    document.getElementById("vol").oninput = (ev) => {
      document.getElementById("vol-label").textContent = ev.target.value;
    };
    document.getElementById("vol").onchange = (ev) => {
      post("/api/volume", { volume: Number(ev.target.value) });
    };
    document.getElementById("tab-lib").onclick = () => showTab("lib");
    document.getElementById("tab-mgr").onclick = () => showTab("mgr");
    document.getElementById("tab-up").onclick = () => showTab("up");
    const drop = document.getElementById("drop");
    const file = document.getElementById("file");
    file.onchange = () => uploadFiles(file.files);
    drop.ondragover = (ev) => { ev.preventDefault(); drop.classList.add("hot"); };
    drop.ondragleave = () => drop.classList.remove("hot");
    drop.ondrop = (ev) => {
      ev.preventDefault();
      drop.classList.remove("hot");
      uploadFiles(ev.dataTransfer.files);
    };
    async function pulse() {
      try {
        const r = await fetch("/api/player", { cache: "no-store" });
        if (!r.ok) return;
        const p = await r.json();
        applyPlayer(p);
      } catch (_e) {}
    }
    refresh();
    setInterval(refresh, 2000);
    setInterval(pulse, 120);
  </script>
</body>
</html>
